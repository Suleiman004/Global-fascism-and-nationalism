<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国大陆海外匿名选举平台</title>
    <!-- Tailwind CSS 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        panelbg: '#151c2c',
                        bordercolor: '#1e293b',
                        accent: '#3b82f6',
                        textmain: '#e2e8f0',
                        textmuted: '#94a3b8'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 顶部导航 -->
    <header class="border-b border-bordercolor bg-panelbg/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-accent rounded-full animate-pulse"></div>
                <h1 class="text-xl font-bold tracking-wide text-textmain">中国大陆海外匿名选举平台</h1>
            </div>
            <div>
                <button id="admin-btn" onclick="openAdminModal()" class="px-4 py-2 text-sm bg-accent/20 hover:bg-accent/40 text-accent border border-accent/40 rounded-lg transition duration-200">
                    管理员登录
                </button>
            </div>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- 统计概览条 -->
        <div class="bg-panelbg border border-bordercolor rounded-xl p-6 mb-8 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h2 class="text-2xl font-bold text-textmain">多党派及无党派候选人竞选与匿名民意表决平台</h2>
                <p class="text-sm text-textmuted mt-1">支持按党派检索、在线匿名投票及发表匿名留言（实时汇总）</p>
            </div>
            <div class="flex items-center space-x-6 text-right">
                <div>
                    <span class="text-xs text-textmuted block">总投票数</span>
                    <span id="total-votes-count" class="text-2xl font-extrabold text-accent">0</span>
                </div>
                <div>
                    <span class="text-xs text-textmuted block">展示候选人数</span>
                    <span id="total-candidates-count" class="text-2xl font-extrabold text-textmain">0</span>
                </div>
            </div>
        </div>

        <!-- 党派筛选栏 -->
        <div class="bg-panelbg border border-bordercolor rounded-xl p-4 mb-8 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <label class="text-xs text-textmuted">按党派/身份筛选:</label>
                <select id="filter-party" onchange="render()" class="bg-darkbg border border-bordercolor rounded px-3 py-1.5 text-xs text-textmain focus:outline-none focus:border-accent">
                    <option value="ALL">全部党派与无党派</option>
                    <option value="无党派人士">无党派人士</option>
                    <option value="中国共产党">中国共产党</option>
                    <option value="各民主党派">各民主党派</option>
                    <option value="海外民主党派/新政党">海外民主党派 / 新政党</option>
                </select>
            </div>
            <button onclick="resetFilters()" class="text-xs text-accent hover:underline">显示全部候选人</button>
        </div>

        <!-- 管理员控制面板（登录后显示） -->
        <div id="admin-panel" class="hidden bg-panelbg border border-accent/50 rounded-xl p-6 mb-8 shadow-lg shadow-accent/5">
            <div class="flex justify-between items-center mb-4 border-b border-bordercolor pb-3">
                <h3 class="text-lg font-bold text-accent flex items-center gap-2">
                    <span>⚙️</span> 管理员控制后台（添加候选人）
                </h3>
                <button onclick="logoutAdmin()" class="text-xs px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded hover:bg-red-500/30">
                    退出管理
                </button>
            </div>

            <!-- 添加候选人表单 -->
            <form onsubmit="handleCreateCandidate(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-textmuted mb-1">候选人姓名</label>
                    <input type="text" id="new-name" required placeholder="请输入候选人姓名" class="w-full bg-darkbg border border-bordercolor rounded px-3 py-2 text-sm text-textmain focus:outline-none focus:border-accent">
                </div>
                
                <div>
                    <label class="block text-xs text-textmuted mb-1">所属党派 / 身份</label>
                    <select id="new-party" required onchange="toggleCustomPartyInput()" class="w-full bg-darkbg border border-bordercolor rounded px-3 py-2 text-sm text-textmain focus:outline-none focus:border-accent mb-2">
                        <option value="无党派人士">无党派人士</option>
                        <option value="中国共产党">中国共产党</option>
                        <option value="各民主党派">各民主党派</option>
                        <option value="海外民主党派/新政党">海外民主党派 / 新政党</option>
                        <option value="CUSTOM">+ 自定义党派名称...</option>
                    </select>
                    <!-- 自定义党派名称打字输入框 -->
                    <input type="text" id="custom-party-name" placeholder="请输入自定义党派名称" class="hidden w-full bg-darkbg border border-bordercolor rounded px-3 py-2 text-sm text-textmain focus:outline-none focus:border-accent">
                </div>

                <div>
                    <label class="block text-xs text-textmuted mb-1">竞选主张 / 简介</label>
                    <input type="text" id="new-title" required placeholder="例如：国家体制与政治改革主张" class="w-full bg-darkbg border border-bordercolor rounded px-3 py-2 text-sm text-textmain focus:outline-none focus:border-accent">
                </div>

                <div>
                    <label class="block text-xs text-textmuted mb-1">初始票数</label>
                    <input type="number" id="new-votes" placeholder="默认 0" class="w-full bg-darkbg border border-bordercolor rounded px-3 py-2 text-sm text-textmain focus:outline-none focus:border-accent">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs text-textmuted mb-1">上传候选人照片</label>
                    <input type="file" id="new-file" accept="image/*" class="w-full text-xs text-textmuted file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-accent/20 file:text-accent">
                </div>

                <div class="md:col-span-2 lg:col-span-3 flex justify-end">
                    <button type="submit" class="px-6 py-2 bg-accent text-white font-medium rounded-lg hover:bg-blue-600 transition duration-200 text-sm">
                        + 添加新候选人
                    </button>
                </div>
            </form>
        </div>

        <!-- 候选人列表卡片区域 -->
        <div id="candidate-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 动态生成卡片 -->
        </div>
    </main>

    <!-- 底部 -->
    <footer class="border-t border-bordercolor py-6 text-center text-xs text-textmuted">
        <p>© 2026 中国大陆海外匿名选举平台 | 仅用于民间民意表达与表决模拟</p>
    </footer>

    <!-- 管理员登录弹窗 -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-panelbg border border-bordercolor p-6 rounded-xl w-96 max-w-full shadow-2xl">
            <h3 class="text-lg font-bold text-textmain mb-4">管理员登录</h3>
            <p class="text-xs text-textmuted mb-4">请输入管理员密码以进行管理与操作。</p>
            <input type="password" id="admin-pass" placeholder="请输入密码" class="w-full bg-darkbg border border-bordercolor rounded px-3 py-2 text-sm text-textmain mb-4 focus:outline-none focus:border-accent">
            <div class="flex justify-end space-x-3">
                <button onclick="closeAdminModal()" class="px-4 py-2 text-xs bg-darkbg text-textmuted border border-bordercolor rounded hover:bg-bordercolor">取消</button>
                <button onclick="loginAdmin()" class="px-4 py-2 text-xs bg-accent text-white rounded hover:bg-blue-600">确认登录</button>
            </div>
        </div>
    </div>

    <!-- 脚本逻辑 -->
    <script>
        // 管理员密码设置为：2580
        const ADMIN_PASSWORD = '2580';

        // 默认候选人示例
        const defaultCandidates = [
            { id: 1, name: "候选人 A", party: "无党派人士", title: "宪政与体制改革主张方案", votes: 152, photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400", comments: [] },
            { id: 2, name: "候选人 B", party: "海外民主党派/新政党", title: "市场经济与深化开放主张方案", votes: 120, photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400", comments: [] },
            { id: 3, name: "候选人 C", party: "各民主党派", title: "民生福利与教育平等主张方案", votes: 110, photo: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400", comments: [] }
        ];

        let candidates = JSON.parse(localStorage.getItem('vote_candidates_v6')) || defaultCandidates;
        let isAdmin = false; 

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            render();
            updateAdminUI();
        });

        // 控制自定义党派输入框的显示与隐藏
        function toggleCustomPartyInput() {
            const select = document.getElementById('new-party');
            const customInput = document.getElementById('custom-party-name');
            if (select.value === 'CUSTOM') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
            }
        }

        // 动态更新顶部党派筛选下拉框（自动收集所有出现的党派）
        function updateFilterPartyOptions() {
            const filterSelect = document.getElementById('filter-party');
            if (!filterSelect) return;
            const currentValue = filterSelect.value;
            
            const baseParties = ["无党派人士", "中国共产党", "各民主党派", "海外民主党派/新政党"];
            const allParties = Array.from(new Set([
                ...baseParties,
                ...candidates.map(c => c.party)
            ]));

            filterSelect.innerHTML = `<option value="ALL">全部党派与无党派</option>` + 
                allParties.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
            
            filterSelect.value = currentValue;
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('vote_candidates_v6', JSON.stringify(candidates));
        }

        // 计算总票数
        function getTotalVotes() {
            return candidates.reduce((sum, item) => sum + item.votes, 0);
        }

        // 重置筛选
        function resetFilters() {
            document.getElementById('filter-party').value = 'ALL';
            render();
        }

        // HTML转义，提高安全性
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 渲染页面
        function render() {
            updateFilterPartyOptions();

            const grid = document.getElementById('candidate-grid');
            const partyFilter = document.getElementById('filter-party').value;

            // 按党派过滤
            const filtered = candidates.filter(c => partyFilter === 'ALL' || c.party === partyFilter);

            const totalVotes = getTotalVotes();
            
            document.getElementById('total-votes-count').innerText = totalVotes;
            document.getElementById('total-candidates-count').innerText = filtered.length;

            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-textmuted">该党派/分类下暂无候选人，您可以登录管理员账号添加。</div>`;
                return;
            }

            filtered.forEach(c => {
                const percent = totalVotes > 0 ? ((c.votes / totalVotes) * 100).toFixed(1) : 0;
                const hasVoted = localStorage.getItem(`voted_p_${c.id}`);
                const commentList = c.comments || [];

                grid.innerHTML += `
                    <div class="bg-panelbg border border-bordercolor rounded-xl overflow-hidden flex flex-col justify-between hover:border-accent/40 transition duration-300">
                        <div>
                            <div class="h-56 bg-darkbg overflow-hidden relative">
                                <img src="${c.photo}" alt="${escapeHtml(c.name)}" class="w-full h-full object-cover object-center">
                                <div class="absolute top-3 right-3 bg-darkbg/80 backdrop-blur px-2.5 py-1 rounded-full text-xs text-accent font-semibold border border-bordercolor">
                                    ${percent}%
                                </div>
                                <div class="absolute bottom-3 left-3">
                                    <span class="bg-purple-600/80 backdrop-blur text-white text-[11px] px-2.5 py-0.5 rounded border border-purple-400/30">${escapeHtml(c.party)}</span>
                                </div>
                            </div>
                            <div class="p-5">
                                <h3 class="text-xl font-bold text-textmain">${escapeHtml(c.name)}</h3>
                                <p class="text-xs text-textmuted mt-1 min-h-[32px]">${escapeHtml(c.title)}</p>
                                
                                <div class="mt-4">
                                    <div class="flex justify-between text-xs mb-1">
                                        <span class="text-textmuted">获得得票</span>
                                        <span class="font-bold text-accent">${c.votes} 票</span>
                                    </div>
                                    <div class="w-full bg-darkbg h-2 rounded-full overflow-hidden border border-bordercolor">
                                        <div class="bg-accent h-full transition-all duration-500" style="width: ${percent}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="p-5 pt-0">
                            <!-- 投票按钮 -->
                            <button onclick="userVote(${c.id})" ${hasVoted ? 'disabled' : ''} 
                                class="w-full py-2.5 rounded-lg text-sm font-bold transition duration-200 mb-4 
                                ${hasVoted ? 'bg-bordercolor text-textmuted cursor-not-allowed' : 'bg-accent text-white hover:bg-blue-600 shadow-lg shadow-accent/20'}">
                                ${hasVoted ? '已投此候选人' : '投他一票'}
                            </button>

                            <!-- 匿名留言区 -->
                            <div class="border-t border-bordercolor/60 pt-3">
                                <h4 class="text-xs font-semibold text-textmuted mb-2 flex justify-between">
                                    <span>💬 匿名讨论 (${commentList.length})</span>
                                </h4>
                                
                                <!-- 留言列表显示 -->
                                <div class="max-h-32 overflow-y-auto space-y-2 mb-3 text-xs pr-1">
                                    ${commentList.length === 0 ? '<p class="text-textmuted text-[11px] italic">暂无留言，快来抢沙发！</p>' : ''}
                                    ${commentList.map(item => `
                                        <div class="bg-darkbg/80 p-2.5 rounded-lg border border-bordercolor">
                                            <p class="text-textmain text-[11px] leading-snug">${escapeHtml(item.text)}</p>
                                            <span class="text-[9px] text-textmuted block text-right mt-1">${item.time}</span>
                                        </div>
                                    `).join('')}
                                </div>

                                <!-- 发表匿名留言输入框 -->
                                <div class="flex gap-2">
                                    <input type="text" id="comment-input-${c.id}" placeholder="撰写匿名表达评论..." class="flex-grow bg-darkbg border border-bordercolor rounded px-2.5 py-1 text-xs text-textmain focus:outline-none focus:border-accent">
                                    <button onclick="addComment(${c.id})" class="px-3 py-1.5 bg-accent/20 hover:bg-accent/40 text-accent border border-accent/30 rounded text-xs transition duration-200">发送</button>
                                </div>
                            </div>

                            <!-- 管理员控制按键 -->
                            ${isAdmin ? `
                                <div class="mt-4 pt-3 border-t border-red-500/30 bg-red-950/10 -mx-5 -mb-5 p-3 px-5 flex items-center justify-between gap-2">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-[11px] text-textmuted">改票:</span>
                                        <input type="number" id="edit-votes-${c.id}" value="${c.votes}" class="w-16 bg-darkbg border border-bordercolor rounded px-2 py-1 text-xs text-textmain">
                                        <button onclick="adminModifyVotes(${c.id})" class="px-2 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded text-xs hover:bg-amber-500/30">保存</button>
                                    </div>
                                    <button onclick="adminDeleteCandidate(${c.id})" class="px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded text-xs hover:bg-red-500/30">删除候选人</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            saveData();
        }

        // 发表匿名留言功能
        function addComment(id) {
            const input = document.getElementById(`comment-input-${id}`);
            const text = input.value.trim();
            if (!text) return;

            const cand = candidates.find(c => c.id === id);
            if (cand) {
                if (!cand.comments) cand.comments = [];
                
                const now = new Date();
                const timeStr = `${(now.getMonth() + 1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                cand.comments.push({
                    text: text,
                    time: timeStr
                });

                render();
            }
        }

        // 匿名表决投票
        function userVote(id) {
            const cand = candidates.find(c => c.id === id);
            if (cand) {
                cand.votes += 1;
                localStorage.setItem(`voted_p_${id}`, 'true');
                render();
            }
        }

        // 管理员控制弹窗
        function openAdminModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('login-modal').classList.add('hidden'); }

        // 管理员登录验证
        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                closeAdminModal();
                updateAdminUI();
                render();
                document.getElementById('admin-pass').value = '';
            } else {
                alert('管理员密码不正确！');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            updateAdminUI();
            render();
        }

        function updateAdminUI() {
            const btn = document.getElementById('admin-btn');
            const panel = document.getElementById('admin-panel');
            if (isAdmin) {
                btn.innerText = "已进入管理模式";
                panel.classList.remove('hidden');
            } else {
                btn.innerText = "管理员登录";
                panel.classList.add('hidden');
            }
        }

        // 管理员：添加候选人
        function handleCreateCandidate(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value;
            
            // 读取党派：如果是 CUSTOM，则取输入框填写的自定义党派名称
            const partySelect = document.getElementById('new-party').value;
            const customParty = document.getElementById('custom-party-name').value.trim();
            const party = (partySelect === 'CUSTOM' && customParty) ? customParty : partySelect;

            const title = document.getElementById('new-title').value;
            const votes = parseInt(document.getElementById('new-votes').value) || 0;
            const fileInput = document.getElementById('new-file');

            const addCandidateWithPhoto = (photoUrl) => {
                candidates.push({
                    id: Date.now(),
                    name,
                    party,
                    title,
                    votes,
                    photo: photoUrl || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400",
                    comments: []
                });
                render();
                e.target.reset();
                document.getElementById('custom-party-name').classList.add('hidden');
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function (evt) {
                    addCandidateWithPhoto(evt.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                addCandidateWithPhoto();
            }
        }

        // 管理员：修改票数
        function adminModifyVotes(id) {
            const val = parseInt(document.getElementById(`edit-votes-${id}`).value);
            const cand = candidates.find(c => c.id === id);
            if (cand && !isNaN(val)) {
                cand.votes = val;
                render();
            }
        }

        // 管理员：删除候选人
        function adminDeleteCandidate(id) {
            if (confirm("确定要删除该候选人吗？")) {
                candidates = candidates.filter(c => c.id !== id);
                render();
            }
        }
    </script>
</body>
</html>
