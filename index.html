<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <script>

            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        panelbg: '#151c2c',
                        bordercolor: '#1e293b',
                        accent: '#3b82f6',
                        textmain: '#e2e8f0',
                        textmuted: '#94a3b8'
                    }
                }
            }
        }
    </script>
    <style>
        body {
